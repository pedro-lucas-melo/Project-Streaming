<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quem está assistindo?</title>
    <link rel="stylesheet" href="/static/theme.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* gradiente fica em camada fixa (body::before, theme.css) —
               background-attachment: fixed no body mata o scroll composto na TV */
            background-color: var(--bg-0);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 3rem;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .profiles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* margin no lugar de gap: o webview da TV (Tizen 5.0 = Chromium 63)
               não suporta gap em flexbox */
            margin: 0 1rem;
        }

        .avatar {
            width: 180px;
            height: 72px;
            border-radius: var(--radius);
            background: var(--glass);
            -webkit-backdrop-filter: var(--blur);
            backdrop-filter: var(--blur);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--glass-border);
            transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
            padding: 0 8px;
            overflow: hidden;
        }

        .profile-btn:hover .avatar,
        .profile-btn:focus .avatar {
            border-color: var(--accent);
            box-shadow: var(--shadow);
            transform: scale(1.05);
        }

        .profile-btn:focus { outline: none; }

        .name {
            color: var(--text);
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
            line-height: 1;
        }
    </style>
</head>
<body>

{% include "_carousel.html" %}

<h1>Quem está assistindo?</h1>

<div class="profiles">
    {% for p in profiles %}
    <form method="POST" action="/profiles/select">
        <input type="hidden" name="profile_id" value="{{ p.id }}">
        <button class="profile-btn" type="submit">
            <div class="avatar">
                <span class="name">{{ p.name }}</span>
            </div>
        </button>
    </form>
    {% endfor %}
</div>

<script>
(function() {
    var btns = Array.prototype.slice.call(document.querySelectorAll(".profile-btn"));
    btns.forEach(function(b) { b.setAttribute("tabindex", "0"); });

    // Fonte máxima que cabe em todos os retângulos: mede cada nome e aplica
    // o menor tamanho em todos, pra ficarem uniformes
    var names = Array.prototype.slice.call(document.querySelectorAll(".avatar .name"));
    var common = 60;
    names.forEach(function(n) {
        var avatar = n.parentNode;
        var maxW = avatar.clientWidth - 16;
        var maxH = avatar.clientHeight - 10;
        var size = 60;
        n.style.fontSize = size + "px";
        while (size > 14 && (n.scrollWidth > maxW || n.offsetHeight > maxH)) {
            size -= 2;
            n.style.fontSize = size + "px";
        }
        if (size < common) common = size;
    });
    names.forEach(function(n) { n.style.fontSize = common + "px"; });

    if (btns.length) btns[0].focus();

    document.addEventListener("keydown", function(e) {
        var c = e.keyCode || e.which;
        var idx = btns.indexOf(document.activeElement);
        if (idx === -1) { if (c === 39 || c === 37 || c === 40 || c === 38) { e.preventDefault(); btns[0].focus(); } return; }
        if (c === 39 || c === 40) { e.preventDefault(); if (idx + 1 < btns.length) btns[idx + 1].focus(); }
        else if (c === 37 || c === 38) { e.preventDefault(); if (idx - 1 >= 0) btns[idx - 1].focus(); }
        else if (c === 13) { e.preventDefault(); btns[idx].closest("form").submit(); }
    });
})();
</script>
</body>
</html>
