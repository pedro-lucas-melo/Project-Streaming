<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>{{ series }}</title>
    <link rel="stylesheet" href="/static/theme.css">

    <style>
        body {
            background-color: var(--bg-0);
            background-image: var(--bg-app);
            background-attachment: fixed;
            color: var(--text);
            font-family: var(--font);
            text-align: center;
            min-height: 100vh;
        }

        .grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            padding: 28px 24px;
            border-radius: var(--radius);
            width: 260px;
            font-size: 1.3rem;
            transition: transform 0.2s, box-shadow 0.2s;
            /* margin no lugar de gap: o webview da TV (Tizen 5.0 = Chromium 63)
               não suporta gap em flexbox */
            margin: 16px 14px;
        }

        .card:hover { box-shadow: var(--shadow); transform: scale(1.05); cursor: pointer; z-index: 2; }
        .card:focus { transform: scale(1.08); outline: none; box-shadow: var(--focus); z-index: 3; }

        a {
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body tabindex="0">

{% include "_carousel.html" %}

<nav class="crumbs">
    <a class="crumb brand" href="/profile/{{ profile_slug }}">BlackFlix</a>
    <span class="crumb-sep">›</span>
    <a class="crumb" href="/profiles/exit">{{ profile_name }}</a>
    <span class="crumb-sep">›</span>
    <a class="crumb current" href="/series-list">Séries</a>
    <span class="crumb-sep">›</span>
    <a class="crumb" href="/movies">Filmes</a>
</nav>

<h1>{{ series }}</h1>

<div class="grid">
    {% for season in seasons %}
        <a href="/season?series={{ series }}&season={{ season }}">
            <div class="card" {% if loop.first %}autofocus{% endif %}>
                {{ season }}
            </div>
        </a>
    {% endfor %}
</div>

<script src="/static/tv-nav.js"></script>
<script>
// Voltar = página anterior (history.back). Fallback p/ catálogo se não há histórico.
function goBack() {
    if (history.length > 1) history.back();
    else window.location.href = "/series-list";
}
(function() {
    function getFocusable() {
        return Array.prototype.slice.call(document.querySelectorAll('.crumb, .card'))
            .filter(function(el) { return el.offsetParent !== null; });
    }
    var all = getFocusable();
    all.forEach(function(el){ if(!el.getAttribute("tabindex")) el.setAttribute("tabindex","0"); });
    var firstFocus = document.querySelector('.card') || all[0];
    if (firstFocus) setTimeout(function(){ firstFocus.focus(); }, 100);

    document.addEventListener("keydown", function(e) {
        var kc = e.keyCode || e.which;
        if (kc===10009||e.key==="XF86Back") { e.preventDefault(); goBack(); return; }
        var items = getFocusable(), active = document.activeElement;
        if (items.indexOf(active) === -1) { if (kc===37||kc===38||kc===39||kc===40) { e.preventDefault(); items[0]&&items[0].focus(); } return; }
        if (kc===13||e.key==="Enter") {
            e.preventDefault();
            var a = active.querySelector("a")||active.closest("a"); if (a) a.click(); else active.click();
            return;
        }
        var dir=kc===39?"right":kc===37?"left":kc===40?"down":kc===38?"up":null;
        if (!dir) return;
        e.preventDefault();
        var next = tvNavMove(items, active, dir);
        if (next) next.focus();
    });
})();
</script>
</body>
</html>
