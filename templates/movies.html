<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e50914">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/theme.css">
    <title>Filmes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* gradiente fica em camada fixa (body::before, theme.css) —
               background-attachment: fixed no body mata o scroll composto na TV */
            background-color: var(--bg-0);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            padding: 40px 0 24px;
            font-size: 3rem;
        }

        .grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 24px 26px 60px;
        }

        .card {
            width: 220px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            /* margin no lugar de gap: o webview da TV (Tizen 5.0 = Chromium 63)
               não suporta gap em flexbox; vertical maior para o scale(1.08)
               do foco não invadir a linha vizinha */
            margin: 18px 14px;
        }

        .card:hover { transform: scale(1.05); box-shadow: var(--shadow); z-index: 2; }
        .card:focus { transform: scale(1.08); outline: none; box-shadow: var(--focus); z-index: 3; }

        .poster {
            width: 220px;
            height: 330px;
            object-fit: cover;
            background: var(--surface-2);
            display: block;
        }

        .poster-placeholder {
            width: 220px;
            height: 330px;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }

        .card-title {
            padding: 12px 10px 6px;
            font-size: 1.1rem;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.3;
        }

    </style>
</head>
<body>

{% include "_carousel.html" %}

<nav class="crumbs">
    <a class="crumb brand" href="/profile/{{ profile_slug }}">BlackFlix</a>
    <span class="crumb-sep">›</span>
    <a class="crumb" href="/profiles/exit">{{ profile_name }}</a>
    <span class="crumb-sep">›</span>
    <a class="crumb" href="/series-list">Séries</a>
    <span class="crumb-sep">›</span>
    <a class="crumb current" href="/movies">Filmes</a>
</nav>

<div class="grid">
    {% for movie in movies %}
    <div class="card">
        <div style="cursor:pointer" data-path="{{ movie.path }}" onclick="openMovie(this)">
            {% if movie.poster_url %}
            <img class="poster" src="{{ movie.poster_url }}" alt="{{ movie.name }}" loading="lazy">
            {% else %}
            <div class="poster-placeholder">🎥</div>
            {% endif %}
            <div class="card-title">{{ movie.name }}</div>
        </div>
    </div>
    {% endfor %}
</div>

<script src="/static/tv-nav.js"></script>
<script>
function openMovie(el) {
    window.location.href = "/watch?path=" + encodeURIComponent(el.dataset.path);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
(function() {
    function getFocusable() {
        return Array.prototype.slice.call(document.querySelectorAll('.crumb, .card'))
            .filter(function(el) { return el.offsetParent !== null; });
    }
    function activate(el) {
        if (el.tagName==="BUTTON") { el.click(); return; }
        var dp = el.querySelector("[data-path]"); if (dp) { dp.click(); return; }
        var a = el.querySelector("a"); if (a) { a.click(); return; }
        el.click();
    }
    document.addEventListener("keydown", function(e) {
        if (["INPUT","TEXTAREA","SELECT"].indexOf(document.activeElement.tagName) !== -1) return;
        var kc = e.keyCode || e.which;
        if (kc===10009||e.key==="XF86Back") { e.preventDefault(); window.location.href="/profile/{{ profile_slug }}"; return; }
        var items = getFocusable();
        if (!items.length) return;
        var active = document.activeElement;
        if (items.indexOf(active) === -1) {
            if (kc===37||kc===38||kc===39||kc===40) { e.preventDefault(); items[0].focus(); }
            return;
        }
        if (kc===13||e.key==="Enter") { e.preventDefault(); activate(active); return; }
        var dir=kc===39?"right":kc===37?"left":kc===40?"down":kc===38?"up":null;
        if (!dir) return;
        e.preventDefault();
        var next = tvNavMove(items, active, dir);
        if (next) next.focus();
    });
    var all = getFocusable();
    all.forEach(function(el){ if(!el.getAttribute("tabindex")) el.setAttribute("tabindex","0"); });
    var firstFocus = document.querySelector('.card') || all[0];
    if (firstFocus) setTimeout(function(){ firstFocus.focus(); }, 100);
})();
</script>

</body>
</html>
